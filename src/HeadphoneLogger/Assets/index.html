<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>耳机使用统计</title>
<script src="echarts.min.js"></script>
<style>
  :root {
    --paper:#fbfaf5; --ink:#2b2b2b; --muted:#8a8a86; --rule:#e4e1d8; --accent:#3a5f8a;
    --card:#fff; --card-hero:#f3f7fc; --hover:#faf7ef; --dayhdr:#f7f5ef;
    --tag:#eef2f7; --tag-un:#f0efea; --chip-bg:#fdf3e3; --chip-fg:#8a6a2a; --chip-line:#ead9b0;
    --chip-hover:#fbebc8; --chip-b:#a5742a; --hl:#fff7e0; --up:#5a8a5a; --down:#b06050;
    --splitline:#eee; --bar1:#6f8fbf; --bar2:#5a7ba6; --heat1:#f2eee4; --heat2:#b8c8e0;
    --theme-btn-bg:#fff; --theme-btn-fg:#2b2b2b;
    --pane-fade:0.22s; --pane-ease:cubic-bezier(.22,.61,.36,1);
  }
  body.dark {
    --paper:#1b1d21; --ink:#e4e4e4; --muted:#9a9a9a; --rule:#383b41; --accent:#7da2cc;
    --card:#23262b; --card-hero:#262b33; --hover:#2a2e35; --dayhdr:#26292f;
    --tag:#2c3140; --tag-un:#2a2d33; --chip-bg:#3a3324; --chip-fg:#d8b877; --chip-line:#4a4130;
    --chip-hover:#443b28; --chip-b:#e0c080; --hl:#3d3a2a; --up:#7db87d; --down:#d07a6a;
    --splitline:#3a3d44; --bar1:#5a7ba6; --bar2:#4a6a94; --heat1:#2a2e36; --heat2:#3a4a66;
    --theme-btn-bg:#2c3037; --theme-btn-fg:#e4e4e4;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; overflow:hidden; }
  body { font-family:"Source Han Serif SC","Songti SC",Georgia,serif; background:var(--paper); color:var(--ink); display:flex; flex-direction:column; transition:background var(--pane-fade) var(--pane-ease),color var(--pane-fade) var(--pane-ease); }
  header { padding:10px 18px 0; flex:none; }
  .hdr { display:flex; align-items:baseline; gap:12px; margin-bottom:8px; }
  h1 { font-size:18px; font-weight:600; letter-spacing:.5px; }
  .sub { color:var(--muted); font-size:12px; }
  nav.tabs { display:flex; gap:2px; border-bottom:1px solid var(--rule); }
  .tab { background:none; border:none; font-family:inherit; font-size:13.5px; padding:7px 16px; cursor:pointer; color:var(--muted); border-bottom:2px solid transparent; }
  .tab.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
  .tab:hover { color:var(--ink); }
  main { flex:1; min-height:0; padding:12px 18px 14px; }
  .pane { display:flex; flex-direction:column; height:100%; gap:10px; }
  .pane.hidden { display:none; }
  .cards { display:flex; gap:12px; flex:none; }
  .card { background:var(--card); border:1px solid var(--rule); border-radius:8px; padding:10px 14px; flex:1; box-shadow:0 1px 2px rgba(0,0,0,.03); }
  .card .k { font-size:11.5px; color:var(--muted); }
  .card .v { font-size:19px; font-weight:600; margin-top:2px; }
  .card .d { font-size:11px; margin-top:2px; color:var(--muted); }
  .card.hero { border-color:var(--accent); background:linear-gradient(180deg,var(--card),var(--card-hero)); }
  .card.hero .v { font-size:30px; color:var(--accent); margin-top:4px; }
  .card.hero .d { font-size:12px; }
  .up { color:var(--up); } .down { color:var(--down); }
  .two { display:flex; gap:12px; flex:1; min-height:0; }
  .chart { background:var(--card); border:1px solid var(--rule); border-radius:8px; padding:10px 12px; display:flex; flex-direction:column; flex:1; min-width:0; }
  .chart h3 { font-size:13px; font-weight:600; margin-bottom:4px; flex:none; }
  .chart .hint { font-size:11px; color:var(--muted); margin-bottom:4px; flex:none; }
  .box { flex:1; min-height:0; }
  table { width:100%; border-collapse:collapse; font-size:12px; background:var(--card); }
  th, td { text-align:left; padding:6px 9px; border-bottom:1px solid var(--rule); white-space:nowrap; }
  th { color:var(--muted); font-weight:600; font-size:11px; }
  tr:hover td { background:var(--hover); }
  .tag { display:inline-block; padding:1px 7px; border-radius:9px; font-size:10.5px; margin-right:3px; background:var(--tag); color:var(--accent); }
  .tag.un { background:var(--tag-un); color:var(--muted); }
  .btn { border:1px solid var(--rule); background:var(--card); color:var(--ink); padding:1px 9px; border-radius:6px; font-size:11.5px; cursor:pointer; transition:border-color .15s,color .15s,background var(--pane-fade) var(--pane-ease); }
  .btn:hover { border-color:var(--accent); color:var(--accent); }
  .editbar { display:none; background:var(--card); border:1px solid var(--rule); border-radius:8px; padding:8px 12px; gap:10px; align-items:center; flex-wrap:wrap; flex:none; }
  .editbar.visible { display:flex; }
  .editbar label { font-size:12px; color:var(--muted); }
  select, input[type=text] { font-family:inherit; font-size:12px; border:1px solid var(--rule); border-radius:6px; padding:2px 7px; background:var(--card); color:var(--ink); }
  .editbar .tags { display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:12px; }
  .filterbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; flex:none; background:var(--card); border:1px solid var(--rule); border-radius:8px; padding:8px 12px; }
  .filterbar .foot { padding-top:0; margin-left:auto; }
  .dayhdr td { background:var(--dayhdr); color:var(--muted); font-weight:600; }
  .tblwrap { flex:1; overflow:auto; border:1px solid var(--rule); border-radius:8px; }
  .empty { color:var(--muted); padding:40px; text-align:center; }
  .foot { color:var(--muted); font-size:10.5px; flex:none; padding-top:6px; }
  .toolbar { display:flex; align-items:center; gap:10px; flex:none; }
  .toolbar .spacer { flex:1; }
  .chip { background:var(--chip-bg); color:var(--chip-fg); border:1px solid var(--chip-line); border-radius:14px; padding:3px 12px; font-size:12px; cursor:pointer; transition:background .15s; }
  .chip:hover { background:var(--chip-hover); }
  .chip b { color:var(--chip-b); }
  .sw { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:4px; cursor:pointer; }
  .scenetbl { flex:none; margin-top:8px; border-top:1px solid var(--rule); font-size:12px; }
  .scenetbl table { border:none; }
  .scenetbl td, .scenetbl th { padding:3px 9px; border:none; }
  .scenetbl .dur { text-align:right; font-variant-numeric:tabular-nums; }
  .scenetbl .ovl { color:var(--muted); font-size:10.5px; }
  tr.hl td { background:var(--hl) !important; }
  .hidden { display:none !important; }
  /* 动效：tab 淡入 */
  .pane { animation:paneIn var(--pane-fade) var(--pane-ease); }
  @keyframes paneIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
  /* 动效：明细行淡入 */
  #segTable tbody tr { animation:rowIn 0.25s var(--pane-ease); }
  @keyframes rowIn { from { opacity:0; transform:translateY(2px); } to { opacity:1; transform:none; } }
  /* 主题切换按钮 */
  #themeBtn { background:var(--theme-btn-bg); color:var(--theme-btn-fg); border:1px solid var(--rule); border-radius:6px; padding:2px 10px; font-size:12px; cursor:pointer; font-family:inherit; transition:background var(--pane-fade) var(--pane-ease),color var(--pane-fade) var(--pane-ease),border-color .15s; }
  #themeBtn:hover { border-color:var(--accent); }
</style>
</head>
<body>
<header>
  <div class="hdr">
    <h1>耳机使用记录</h1>
    <span class="sub" id="subtitle"></span>
    <span class="spacer" style="flex:1"></span>
    <button id="themeBtn" title="切换深色/浅色">🌙 深色</button>
  </div>
  <nav class="tabs">
    <button class="tab active" data-tab="overview">总览</button>
    <button class="tab" data-tab="heat">时段</button>
    <button class="tab" data-tab="device">设备</button>
    <button class="tab" data-tab="detail">明细</button>
  </nav>
</header>

<main>
  <section id="overview" class="pane">
    <div class="cards" id="cards"></div>
    <div class="toolbar">
      <span id="unconfirmedChip" class="chip hidden"></span>
      <span class="spacer"></span>
      <label class="sw"><input type="checkbox" id="onlyConfirmed"> 只看已确认</label>
    </div>
    <div class="two">
      <div class="chart"><h3>场景分配</h3><div class="hint" id="sceneHint"></div><div class="box" id="sceneChart"></div>
        <div class="scenetbl" id="sceneTable"></div></div>
      <div class="chart"><h3>今日各小时</h3><div class="box" id="todayChart"></div></div>
    </div>
  </section>

  <section id="heat" class="pane hidden">
    <div class="chart"><h3>时段分布（一周七天 × 24 小时，周一为起始）</h3><div class="box" id="heatChart"></div></div>
    <div class="chart"><h3>每日时长（近 30 天）</h3><div class="box" id="dailyChart"></div></div>
  </section>

  <section id="device" class="pane hidden">
    <div class="chart"><h3>各耳机使用时长</h3><div class="hint">按会话记录的输出设备分组</div><div class="box" id="deviceChart"></div></div>
  </section>

  <section id="detail" class="pane hidden">
    <div class="editbar" id="editbar">
      <label>主场景</label><select id="eScene"></select>
      <div class="tags" id="eScenes"></div>
      <label>备注</label><input type="text" id="eNote" style="width:140px" maxlength="120">
      <label><input type="checkbox" id="eConfirmed"> 已确认</label>
      <button class="btn" id="eSave" style="color:var(--accent)">保存</button>
      <button class="btn" id="eCancel">取消</button>
    </div>
    <div class="filterbar">
      <select id="fRange">
        <option value="today">今天</option>
        <option value="week">本周</option>
        <option value="month">本月</option>
        <option value="custom">自定义</option>
        <option value="all" selected>全部</option>
      </select>
      <input type="date" id="fFrom" class="hidden">
      <span id="fToSep" class="hidden">至</span>
      <input type="date" id="fTo" class="hidden">
      <select id="fScene"><option value="">全部场景</option></select>
      <select id="fDevice"><option value="">全部设备</option></select>
      <select id="fConfirm">
        <option value="">全部确认状态</option>
        <option value="1">已确认</option>
        <option value="0">未确认</option>
      </select>
      <select id="fMinDur">
        <option value="">最短时长</option>
        <option value="60">1 分钟</option>
        <option value="180">3 分钟</option>
        <option value="300">5 分钟</option>
        <option value="600">10 分钟</option>
      </select>
      <input type="text" id="fSearch" placeholder="搜索 应用 / 标题 / 备注">
      <button class="btn" id="fExport">导出 CSV</button>
      <span class="foot" id="foot"></span>
    </div>
    <div class="tblwrap">
      <table id="segTable">
        <thead><tr><th>开始时间</th><th>时长</th><th>场景</th><th>应用 / 标题</th><th>确认</th><th>备注</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const SCENE = { Music:'音乐', Video:'视频', Game:'游戏', Course:'网课', Meeting:'会议', Coding:'编程', Other:'其他', Unmarked:'未标注' };
const SCENE_KEYS = Object.keys(SCENE);
let editingId = null, lastSegments = [], allData = null;
const filter = { range:'all', scene:'', device:'', confirm:'', search:'', from:null, to:null, minDur:0 };

function fmt(sec) {
  sec = Math.round(sec || 0);
  if (sec < 60) return sec + ' 秒';
  const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  return (h > 0 ? h + ' 小时 ' : '') + m + ' 分钟';
}
function shortDate(s) { const d = new Date(s); return d.toLocaleString('zh-CN', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'}); }
function send(m) { if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(JSON.stringify(m)); }

function renderCards(o) {
  const items = [
    {k:'今日', v:fmt(o.todaySec), d:diff(o.todaySec, o.yesterdaySec, '较昨日')},
    {k:'本周', v:fmt(o.weekSec), d:diff(o.weekSec, o.prevWeekSec, '较上周')},
    {k:'本月', v:fmt(o.monthSec), d:diff(o.monthSec, o.prevMonthSec, '较上月')},
  ];
  document.getElementById('cards').innerHTML = items.map((c, i) =>
    `<div class="card${i === 0 ? ' hero' : ''}"><div class="k">${c.k}</div><div class="v">${c.v}</div><div class="d">${c.d}</div></div>`).join('');
}
function diff(cur, prev, label) {
  if (prev <= 0) return label + ' —';
  const pct = Math.round((cur - prev) / prev * 100);
  return `<span class="${pct>=0?'up':'down'}">${label} ${pct>=0?'↑':'↓'}${Math.abs(pct)}%</span>`;
}

const sceneChart = echarts.init(document.getElementById('sceneChart'));
const todayChart = echarts.init(document.getElementById('todayChart'));
const dailyChart = echarts.init(document.getElementById('dailyChart'));
const heatChart = echarts.init(document.getElementById('heatChart'));
const deviceChart = echarts.init(document.getElementById('deviceChart'));

// 图表主题色：浅色/深色两套，按 body.dark 取色（render 每次读取当前主题）
const THEME = {
  light: { split:'#eee', bar1:'#6f8fbf', bar2:'#5a7ba6', heat:['#f2eee4','#b8c8e0','#5a7ba6'], label:'#2b2b2b' },
  dark:  { split:'#3a3d44', bar1:'#5a7ba6', bar2:'#4a6a94', heat:['#2a2e36','#3a4a66','#5a7ba6'], label:'#c8c8c8' },
};
function chartTheme() { return document.body.classList.contains('dark') ? THEME.dark : THEME.light; }
const chartAnimation = { animation:true, animationDuration:600, animationEasing:'cubicOut' };

function render(data) {
  renderCards(data.overview);
  document.getElementById('subtitle').textContent =
    `会话 ${data.sessionCount} 次 · ${data.deviceCount} 个设备`;

  const sa = data.sceneAllocation;
  const th = chartTheme();
  document.getElementById('sceneHint').textContent = `总 ${fmt(sa.totalSec)}，并发场景重复计入`;
  sceneChart.setOption({
    ...chartAnimation,
    tooltip: { trigger:'item', formatter: p => `${p.name}<br>${fmt(p.value)}（${p.percent}%）` },
    legend: { bottom: 0, textStyle:{fontFamily:'inherit', fontSize:11, color:th.label} },
    series: [{ type:'pie', radius:['40%','66%'], center:['50%','44%'], data: sa.perScene.map(s => ({name:SCENE[s.scene]||s.scene, value:s.sec})), label:{formatter:'{b} {d}%', fontSize:11, color:th.label} }]
  });
  dailyChart.setOption({
    ...chartAnimation,
    tooltip: { formatter: p => `${p.name}<br>${fmt(p.value)}` },
    grid: { left: 8, right: 16, top: 6, bottom: 22, containLabel:true },
    xAxis: { type:'category', data: data.daily.map(d => d.date.slice(5)), axisLabel:{fontSize:10, interval:2, color:th.label} },
    yAxis: { type:'value', splitLine:{lineStyle:{color:th.split}}, axisLabel:{color:th.label} },
    series: [{ type:'bar', data: data.daily.map(d => d.sec), itemStyle:{color:th.bar1, borderRadius:[3,3,0,0]}, barMaxWidth:16 }]
  });

  todayChart.setOption({
    ...chartAnimation,
    tooltip: { formatter: p => `${p.name} 时 — ${fmt(p.value)}` },
    grid: { left: 8, right: 16, top: 6, bottom: 22, containLabel:true },
    xAxis: { type:'category', data: Array.from({length:24}, (_,i)=>i+'时'), axisLabel:{fontSize:10, interval:3, color:th.label} },
    yAxis: { type:'value', splitLine:{lineStyle:{color:th.split}}, axisLabel:{color:th.label} },
    series: [{ type:'bar', data: data.todayHourly.map(h => h.sec), itemStyle:{color:th.bar2, borderRadius:[3,3,0,0]}, barMaxWidth:16 }]
  });

  const W = ['周一','周二','周三','周四','周五','周六','周日'];
  const cells = data.heatmap.map(c => [c.hour, c.weekday, c.sec]);
  heatChart.setOption({
    ...chartAnimation,
    tooltip: { formatter: p => `${W[p.value[1]]} ${p.value[0]}:00 — ${fmt(p.value[2])}` },
    grid: { left: 8, right: 20, top: 6, bottom: 60, containLabel:true },
    xAxis: { type:'category', data: Array.from({length:24}, (_,i)=>i+'时'), splitArea:{show:true}, axisLabel:{color:th.label} },
    yAxis: { type:'category', data: W, splitArea:{show:true}, axisLabel:{color:th.label} },
    visualMap: { min:0, max: data.heatmap.length ? Math.max(...data.heatmap.map(c=>c.sec)) : 1, calculable:false, orient:'horizontal', left:'center', bottom:0, inRange:{color:th.heat}, textStyle:{color:th.label} },
    series: [{ type:'heatmap', data: cells }]
  });
  deviceChart.setOption({
    ...chartAnimation,
    grid: { left: 8, right: 36, top: 6, bottom: 20, containLabel:true },
    tooltip: { formatter: p => `${p.name}<br>${fmt(p.value)}` },
    xAxis: { type:'value', axisLabel:{formatter: v => fmt(v).replace(' 小时','h').replace(' 分钟','m'), color:th.label}, splitLine:{lineStyle:{color:th.split}} },
    yAxis: { type:'category', data: data.devices.map(d => d.name), inverse:true, axisLabel:{fontSize:11, color:th.label} },
    series: [{ type:'bar', data: data.devices.map(d => d.sec), barWidth:'50%', itemStyle:{color:th.bar1, borderRadius:[0,4,4,0]} }]
  });
  populateFilters(data);
  renderSceneTable(data.sceneAllocation);
  renderUnconfirmedChip(data.unconfirmed);
  allData = data;
  renderTable(data.segments);
}

function renderUnconfirmedChip(n) {
  const chip = document.getElementById('unconfirmedChip');
  if (n > 0) {
    chip.classList.remove('hidden');
    chip.innerHTML = `有 <b>${n}</b> 段待核对，点击查看`;
    chip.onclick = () => {
      document.getElementById('fConfirm').value = '0';
      readFilter();
      renderTable(lastSegments);
      switchTab('detail');
    };
  } else {
    chip.classList.add('hidden');
  }
}

function renderSceneTable(sa) {
  // 场景时长表：每行时长 + 各场景之和与总时长的重叠注解
  let html = '<table><thead><tr><th>场景</th><th class="dur">时长</th><th class="ovl"></th></tr></thead><tbody>';
  for (const s of sa.perScene) {
    const mainShare = sa.perScene.length && sa.totalSec > 0
      ? Math.round(s.sec / sa.totalSec * 100) : 0;
    html += `<tr><td>${SCENE[s.scene] || s.scene}</td><td class="dur">${fmt(s.sec)}</td><td class="ovl">${mainShare}%</td></tr>`;
  }
  html += `</tbody></table>`;
  document.getElementById('sceneTable').innerHTML = html;
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.tab === name));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('hidden', p.id !== name));
  const charts = { overview:[todayChart, sceneChart], heat:[heatChart, dailyChart], device:[deviceChart], detail:[] }[name] || [];
  charts.forEach(c => setTimeout(() => c.resize(), 0));
}

function renderTable(segs) {
  const tbody = document.querySelector('#segTable tbody');
  const list = filterSegs(segs);
  document.getElementById('foot').textContent = list.length ? `共 ${list.length} 条` : '';
  if (!list.length) {
    const msg = segs.length ? '没有匹配的记录' : '还没有记录。插上耳机开始记录吧。';
    tbody.innerHTML = `<tr><td colspan="7"><div class="empty">${msg}</div></td></tr>`;
    return;
  }
  // 按本地日分组，组内按时间倒序，每天显示小计
  const groups = new Map();
  for (const s of list) {
    const d = new Date(s.start);
    const key = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(s);
  }
  const keys = [...groups.keys()].sort((a, b) => b.localeCompare(a));
  let html = '';
  for (const key of keys) {
    const daySegs = groups.get(key).sort((a, b) => new Date(b.start) - new Date(a.start));
    const daySec = daySegs.reduce((sum, s) => sum + (s.durationSec || 0), 0);
    const [y, m, d] = key.split('-').map(Number);
    html += `<tr class="dayhdr"><td colspan="7">${y}年${m}月${d}日 · 共 ${fmt(daySec)}</td></tr>`;
    html += daySegs.map(segRow).join('');
  }
  tbody.innerHTML = html;
}

function segTags(s) { return (s.scenes.length ? s.scenes : [s.scene]); }

function segRow(s) {
  const tags = segTags(s).map(t => `<span class="tag${t==='Unmarked'?' un':''}">${SCENE[t]||t}</span>`).join('');
  return `<tr data-id="${s.id}"${s.id === editingId ? ' class="hl"' : ''}>
    <td>${shortDate(s.start)}</td>
    <td>${fmt(s.durationSec)}</td>
    <td>${SCENE[s.scene]||s.scene}</td>
    <td>${s.app ? esc(s.app) : ''}${s.title ? ' · ' + esc(s.title) : ''}</td>
    <td>${s.confirmed ? '✓' : '—'}</td>
    <td>${s.note ? esc(s.note) : ''}</td>
    <td>
      <button class="btn" onclick="editSeg(${s.id})">编辑</button>
      ${s.app && s.app !== '未知' ? `<button class="btn" onclick="pinRule('${s.app}', '${s.scene}')" title="以后此应用都按该场景记录">固定场景</button>` : ''}
    </td>
  </tr>`;
}

function pinRule(app, scene) {
  if (!confirm(`确定把「${app}」固定为「${SCENE[scene]||scene}」？此后该应用的所有记录都按此场景。`)) return;
  send({type:'setRule', app, scene});
}

function filterSegs(segs) {
  const now = new Date();
  let from = null, to = null;
  if (filter.range === 'today') from = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  else if (filter.range === 'week') {
    from = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    from.setDate(from.getDate() - ((now.getDay() + 6) % 7)); // 周一起
  }
  else if (filter.range === 'month') from = new Date(now.getFullYear(), now.getMonth(), 1);
  else if (filter.range === 'custom') {
    if (filter.from) { from = new Date(filter.from + 'T00:00:00'); to = new Date(filter.to + 'T23:59:59'); }
  }
  const onlyConfirmed = document.getElementById('onlyConfirmed').checked;
  const q = filter.search.toLowerCase();
  return segs.filter(s => {
    const d = new Date(s.start);
    if (from && d < from) return false;
    if (to && d > to) return false;
    if (filter.scene && !segTags(s).includes(filter.scene)) return false;
    if (filter.device && (s.device || '未知设备') !== filter.device) return false;
    if (filter.confirm !== '' && String(s.confirmed ? 1 : 0) !== filter.confirm) return false;
    if (onlyConfirmed && !s.confirmed) return false;
    if (filter.minDur > 0 && (s.durationSec || 0) < filter.minDur) return false;
    if (q && !((s.app || '') + ' ' + (s.title || '') + ' ' + (s.note || '')).toLowerCase().includes(q)) return false;
    return true;
  });
}

function populateFilters(data) {
  const fScene = document.getElementById('fScene');
  fScene.innerHTML = '<option value="">全部场景</option>' + SCENE_KEYS.map(k => `<option value="${k}">${SCENE[k]}</option>`).join('');
  fScene.value = filter.scene;
  const devs = [...new Set(data.segments.map(s => s.device || '未知设备'))].sort();
  const fDevice = document.getElementById('fDevice');
  fDevice.innerHTML = '<option value="">全部设备</option>' + devs.map(n => `<option value="${n}">${esc(n)}</option>`).join('');
  fDevice.value = filter.device;
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function editSeg(id) {
  const s = lastSegments.find(x => x.id === id);
  if (!s) return;
  editingId = id;
  document.getElementById('editbar').classList.add('visible');
  document.getElementById('eScene').innerHTML = SCENE_KEYS.map(k => `<option value="${k}" ${k===s.scene?'selected':''}>${SCENE[k]}</option>`).join('');
  document.getElementById('eScenes').innerHTML = SCENE_KEYS.map(k =>
    `<label style="display:flex;gap:3px;align-items:center;font-size:12px"><input type="checkbox" value="${k}" ${(s.scenes.length?s.scenes:[s.scene]).includes(k)?'checked':''}>${SCENE[k]}</label>`).join('');
  document.getElementById('eNote').value = s.note || '';
  document.getElementById('eConfirmed').checked = !!s.confirmed;
  renderTable(lastSegments); // 高亮编辑行
  const row = document.querySelector(`#segTable tr[data-id="${id}"]`);
  if (row) row.scrollIntoView({ block: 'nearest' });
}
document.getElementById('eSave').onclick = () => {
  if (editingId == null) return;
  const scene = document.getElementById('eScene').value;
  const scenes = Array.from(document.querySelectorAll('#eScenes input:checked')).map(i => i.value);
  if (!scenes.includes(scene)) scenes.push(scene);
  const id = editingId;
  document.getElementById('editbar').classList.remove('visible'); editingId = null;
  send({type:'update', id, scene, scenes,
    note:document.getElementById('eNote').value.trim() || null,
    confirmed:document.getElementById('eConfirmed').checked});
};
document.getElementById('eCancel').onclick = () => { document.getElementById('editbar').classList.remove('visible'); editingId = null; };

/* 明细筛选 */
function readFilter() {
  filter.range = document.getElementById('fRange').value;
  filter.scene = document.getElementById('fScene').value;
  filter.device = document.getElementById('fDevice').value;
  filter.confirm = document.getElementById('fConfirm').value;
  filter.minDur = Number(document.getElementById('fMinDur').value || 0);
  filter.from = document.getElementById('fFrom').value || null;
  filter.to = document.getElementById('fTo').value || null;
}
function toggleCustomRange() {
  const custom = document.getElementById('fRange').value === 'custom';
  document.getElementById('fFrom').classList.toggle('hidden', !custom);
  document.getElementById('fTo').classList.toggle('hidden', !custom);
  document.getElementById('fToSep').classList.toggle('hidden', !custom);
}
['fRange', 'fScene', 'fDevice', 'fConfirm', 'fMinDur'].forEach(id =>
  document.getElementById(id).addEventListener('change', () => { readFilter(); toggleCustomRange(); renderTable(lastSegments); }));
document.getElementById('fFrom').addEventListener('change', () => { readFilter(); renderTable(lastSegments); });
document.getElementById('fTo').addEventListener('change', () => { readFilter(); renderTable(lastSegments); });
document.getElementById('fSearch').addEventListener('input', () => {
  filter.search = document.getElementById('fSearch').value.trim();
  renderTable(lastSegments);
});
document.getElementById('onlyConfirmed').addEventListener('change', () => renderTable(lastSegments));
document.getElementById('fExport').addEventListener('click', () => {
  readFilter();
  let from = null, to = null;
  if (filter.range === 'today') from = new Date().toLocaleDateString('sv');
  else if (filter.range === 'week') {
    const d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    from = d.toLocaleDateString('sv');
  }
  else if (filter.range === 'month') {
    const d = new Date(); d.setDate(1); from = d.toLocaleDateString('sv');
  }
  else if (filter.range === 'custom') { from = filter.from; to = filter.to; }
  send({type:'export', from, to, minDur: filter.minDur});
});
toggleCustomRange();

/* tab 切换（含淡入动效：重新触发 .pane 动画） */
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === b));
  const target = document.getElementById(b.dataset.tab);
  document.querySelectorAll('.pane').forEach(p => { if (p !== target) p.classList.add('hidden'); });
  if (target.classList.contains('hidden')) {
    target.classList.remove('hidden');
    target.style.animation = 'none';
    target.offsetHeight; // 强制 reflow 以重新触发动画
    target.style.animation = '';
  }
  const charts = { overview:[todayChart, sceneChart], heat:[heatChart, dailyChart], device:[deviceChart], detail:[] }[b.dataset.tab] || [];
  charts.forEach(c => setTimeout(() => c.resize(), 0));
}));

/* 主题：初始化 + 切换 */
function applyTheme(dark) {
  document.body.classList.toggle('dark', dark);
  document.getElementById('themeBtn').textContent = dark ? '☀️ 浅色' : '🌙 深色';
  if (allData) render(allData); // 图表重绘为新主题色
}
function initTheme(dark) {
  document.body.classList.toggle('dark', dark);
  document.getElementById('themeBtn').textContent = dark ? '☀️ 浅色' : '🌙 深色';
}
document.getElementById('themeBtn').addEventListener('click', () => send({type:'setTheme'}));

window.chrome.webview.addEventListener('message', e => {
  // 部分 WebView2 版本直接把对象放进 e.data，部分给 JSON 字符串，两种都兼容
  const msg = (typeof e.data === 'string') ? JSON.parse(e.data) : e.data;
  if (msg.type === 'data') {
    lastSegments = msg.data.segments || [];
    if (msg.dark !== undefined) initTheme(msg.dark);
    render(msg.data);
  }
  // M6：编辑态（editbar 可见且未保存）不因后台刷新被清空；只有保存/取消/自己关闭才结束编辑
  if (!document.getElementById('editbar').classList.contains('visible')) {
    editingId = null;
  }
});
document.addEventListener('DOMContentLoaded', () => send({type:'load'}));
window.addEventListener('resize', () => [todayChart, sceneChart, dailyChart, heatChart, deviceChart].forEach(c => c.resize()));
</script>

name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The app and its tests target net10.0-windows (WinForms + WebView2), so the runner must be Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run tests
        run: dotnet test tests/HeadphoneLogger.Tests/HeadphoneLogger.Tests.csproj --nologo
